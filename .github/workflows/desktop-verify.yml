name: Cross-platform desktop verification

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-verify.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} desktop engine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check repository privacy
        run: bash ../scripts/privacy-audit.sh
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
