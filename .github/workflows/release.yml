name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: bash scripts/build-macos-app.sh

      - name: Zip app
        id: package
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          cd build
          ZIP_NAME="Dashcam-Offloader-${SHORT_SHA}.zip"
          zip -r "$ZIP_NAME" "Dashcam Offloader.app"
          SHA256="$(shasum -a 256 "$ZIP_NAME" | awk '{print $1}')"
          {
            echo "zip_name=$ZIP_NAME"
            echo "zip_path=build/$ZIP_NAME"
            echo "sha256=$SHA256"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          gh release create latest \
            --title "Latest Build" \
            --notes "Auto-built from [$(git rev-parse --short HEAD)](https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)) on main." \
            --latest \
            "${{ steps.package.outputs.zip_path }}#${{ steps.package.outputs.zip_name }}"

      - name: Publish public Cloudflare update
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DASHCAM_OFFLOADER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DASHCAM_OFFLOADER_ACCOUNT_ID }}
          UPDATE_BASE_URL: ${{ vars.DASHCAM_OFFLOADER_UPDATE_BASE_URL || 'https://dashcam-offloader-updates.vortexradar.workers.dev' }}
          BUCKET: dashcam-offloader-updates
          VERSION: 0.1.0
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Skipping Cloudflare publish because dedicated Dashcam Offloader Cloudflare secrets are not configured."
            exit 0
          fi

          ASSET_KEY="dashcam-offloader/releases/$ZIP_NAME"
          DOWNLOAD_URL="$UPDATE_BASE_URL/dashcam-offloader/download/latest"
          RELEASE_NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/latest"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          npx --yes wrangler@latest r2 bucket create "$BUCKET" || true
          npx --yes wrangler@latest r2 object put "$BUCKET/$ASSET_KEY" --file "$ZIP_PATH"

          cat > build/latest.json <<JSON
          {
            "version": "$VERSION",
            "build": "$SHORT_SHA",
            "releaseName": "Dashcam Offloader $VERSION ($SHORT_SHA)",
            "releaseNotesURL": "$RELEASE_NOTES_URL",
            "assetName": "$ZIP_NAME",
            "assetKey": "$ASSET_KEY",
            "downloadURL": "$DOWNLOAD_URL",
            "sha256": "$ZIP_SHA256",
            "minimumMacOSVersion": "14.0",
            "publishedAt": "$PUBLISHED_AT",
            "channel": "latest"
          }
          JSON

          npx --yes wrangler@latest r2 object put "$BUCKET/dashcam-offloader/latest.json" --file build/latest.json --content-type application/json
          npx --yes wrangler@latest deploy --config workers/updates/wrangler.toml
