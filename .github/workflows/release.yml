name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: bash scripts/build-macos-app.sh

      - name: Zip app
        run: |
          cd build
          zip -r "Dashcam Offloader.zip" "Dashcam Offloader.app"

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
          gh release create latest \
            --title "Latest Build" \
            --notes "Auto-built from [$(git rev-parse --short HEAD)](https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)) on main." \
            --latest \
            "build/Dashcam Offloader.zip#Dashcam Offloader.zip"
