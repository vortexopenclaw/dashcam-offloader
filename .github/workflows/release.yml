name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build app
        id: buildapp
        run: bash scripts/build-macos-app.sh

      - name: Run verification
        id: repoverify
        run: swift run DashcamOffloader --verify

      - name: Verify built app
        id: appverify
        run: |
          "build/Dashcam Offloader.app/Contents/MacOS/DashcamOffloader" --verify

      - name: Zip app
        id: package
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          rm -rf build/"Open Dashcam Offloader.app" build/"Open Dashcam Offloader.applescript"
          cd build
          ZIP_NAME="Dashcam-Offloader-${SHORT_SHA}.zip"
          zip -r "$ZIP_NAME" "Dashcam Offloader.app"
          SHA256="$(shasum -a 256 "$ZIP_NAME" | awk '{print $1}')"
          {
            echo "zip_name=$ZIP_NAME"
            echo "zip_path=build/$ZIP_NAME"
            echo "sha256=$SHA256"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare and verify signed update manifest
        id: manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DASHCAM_OFFLOADER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DASHCAM_OFFLOADER_ACCOUNT_ID }}
          UPDATE_BASE_URL: ${{ vars.DASHCAM_OFFLOADER_UPDATE_BASE_URL || 'https://dashcam-offloader-updates.vortexradar.workers.dev' }}
          VERSION: 0.1.4
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          ZIP_SHA256: ${{ steps.package.outputs.sha256 }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          UPDATE_SIGNING_KEY: ${{ secrets.DASHCAM_OFFLOADER_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${UPDATE_SIGNING_KEY:-}" ]]; then
            echo "Required update-publishing credentials are not configured." >&2
            exit 1
          fi

          ASSET_KEY="dashcam-offloader/releases/$ZIP_NAME"
          DOWNLOAD_URL="$UPDATE_BASE_URL/dashcam-offloader/download/latest"
          RELEASE_NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/latest"
          RELEASE_NOTES_JSON="$(jq -Rs . docs/releases/latest.md)"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SIGNING_PAYLOAD="$VERSION"$'\n'"$SHORT_SHA"$'\n'"$ASSET_KEY"$'\n'"$ZIP_SHA256"
          SIGNATURE="$(UPDATE_SIGNING_KEY="$UPDATE_SIGNING_KEY" SIGNING_PAYLOAD="$SIGNING_PAYLOAD" swift -e 'import CryptoKit; import Foundation; let key = try Curve25519.Signing.PrivateKey(rawRepresentation: Data(base64Encoded: ProcessInfo.processInfo.environment["UPDATE_SIGNING_KEY"]!)!); print(try key.signature(for: Data(ProcessInfo.processInfo.environment["SIGNING_PAYLOAD"]!.utf8)).base64EncodedString())')"
          cat > build/latest.json <<JSON
          {
            "version": "$VERSION",
            "build": "$SHORT_SHA",
            "releaseName": "Dashcam Offloader $VERSION ($SHORT_SHA)",
            "releaseNotes": $RELEASE_NOTES_JSON,
            "releaseNotesURL": "$RELEASE_NOTES_URL",
            "assetName": "$ZIP_NAME",
            "assetKey": "$ASSET_KEY",
            "downloadURL": "$DOWNLOAD_URL",
            "sha256": "$ZIP_SHA256",
            "signature": "$SIGNATURE",
            "minimumMacOSVersion": "14.0",
            "publishedAt": "$PUBLISHED_AT",
            "channel": "latest"
          }
          JSON

          "build/Dashcam Offloader.app/Contents/MacOS/DashcamOffloader" --verify-update-manifest build/latest.json

      - name: Stage Cloudflare archive and deploy Worker
        id: cloudflarestage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DASHCAM_OFFLOADER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DASHCAM_OFFLOADER_ACCOUNT_ID }}
          BUCKET: dashcam-offloader-updates
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          ASSET_KEY: dashcam-offloader/releases/${{ steps.package.outputs.zip_name }}
        run: |
          set -euo pipefail

          npx --yes wrangler@4.122.0 r2 bucket create "$BUCKET" || true
          npx --yes wrangler@4.122.0 r2 object put "$BUCKET/$ASSET_KEY" --file "$ZIP_PATH" --remote

          npx --yes wrangler@4.122.0 deploy --config workers/updates/wrangler.toml

      - name: Publish latest release
        id: ghrelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-github-latest-release.sh \
            "${{ steps.package.outputs.zip_path }}" \
            "${{ steps.package.outputs.zip_name }}" \
            "${{ github.repository }}"

      - name: Activate public update manifest
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DASHCAM_OFFLOADER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DASHCAM_OFFLOADER_ACCOUNT_ID }}
          BUCKET: dashcam-offloader-updates
        run: |
          set -euo pipefail
          npx --yes wrangler@4.122.0 r2 object put "$BUCKET/dashcam-offloader/latest.json" --file build/latest.json --content-type application/json --remote

      - name: Record release outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS_JSON=$(jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg jobStatus "${{ job.status }}" \
            --arg build "${{ steps.buildapp.outcome }}" \
            --arg repoVerify "${{ steps.repoverify.outcome }}" \
            --arg appVerify "${{ steps.appverify.outcome }}" \
            --arg zip "${{ steps.package.outcome }}" \
            --arg manifest "${{ steps.manifest.outcome }}" \
            --arg cloudflareStage "${{ steps.cloudflarestage.outcome }}" \
            --arg githubRelease "${{ steps.ghrelease.outcome }}" \
            --arg cloudflare "${{ steps.cloudflare.outcome }}" \
            '{sha:$sha, runId:$runId, attempt:$attempt, jobStatus:$jobStatus, steps:{build:$build, repoVerify:$repoVerify, appVerify:$appVerify, zip:$zip, manifest:$manifest, cloudflareStage:$cloudflareStage, githubRelease:$githubRelease, cloudflare:$cloudflare}, recordedAt:(now|todate)}')
          CONTENT=$(printf '%s' "$STATUS_JSON" | base64)
          EXISTING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/release-status.json?ref=ci-status" --jq .sha 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/release-status.json" \
              -f message="Record release outcome for $GITHUB_SHA" \
              -f content="$CONTENT" -f branch=ci-status -f sha="$EXISTING_SHA"
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/release-status.json" \
              -f message="Record release outcome for $GITHUB_SHA" \
              -f content="$CONTENT" -f branch=ci-status
          fi
