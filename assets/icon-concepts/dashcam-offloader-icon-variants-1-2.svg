<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#e7ebf0"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4652"/>
      <stop offset="1" stop-color="#11161d"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36424d"/>
      <stop offset="1" stop-color="#10141a"/>
    </linearGradient>
    <linearGradient id="tileC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2d38"/>
      <stop offset="1" stop-color="#0c1218"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91f7ff"/>
      <stop offset="0.5" stop-color="#1ab7e8"/>
      <stop offset="1" stop-color="#086cc4"/>
    </linearGradient>
    <linearGradient id="greenBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24dcff"/>
      <stop offset="1" stop-color="#21d487"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#b9c4cf"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58d2ff"/>
      <stop offset="1" stop-color="#1468d8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#101820" flood-opacity="0.24"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#021b2a" flood-opacity="0.32"/>
    </filter>
    <g id="sdSmall">
      <path d="M0 24 L54 24 L78 48 L78 120 Q78 132 66 132 L10 132 Q0 132 0 122 Z" fill="url(#card)"/>
      <path d="M12 42 H54 L63 51 V66 H12 Z" fill="#657381" opacity=".55"/>
      <path d="M14 86 H62 M14 102 H50" stroke="#657381" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    </g>
    <g id="dashcamBody">
      <rect x="-118" y="-42" width="236" height="84" rx="30" fill="#071016"/>
      <rect x="-96" y="-56" width="148" height="22" rx="11" fill="#2d3640"/>
      <circle cx="54" cy="0" r="42" fill="#111b24"/>
      <circle cx="54" cy="0" r="30" fill="url(#cyan)"/>
      <circle cx="44" cy="-10" r="9" fill="#d8fbff" opacity=".9"/>
      <rect x="-86" y="-15" width="78" height="30" rx="12" fill="#27313a"/>
    </g>
    <g id="lensCore">
      <circle cx="0" cy="0" r="93" fill="#071017"/>
      <circle cx="0" cy="0" r="72" fill="#142535"/>
      <circle cx="0" cy="0" r="56" fill="url(#cyan)"/>
      <circle cx="-18" cy="-20" r="16" fill="#d7fbff" opacity=".9"/>
      <path d="M-54 25 Q0 66 54 25" fill="none" stroke="#012f55" stroke-width="14" opacity=".55"/>
    </g>
  </defs>

  <rect width="1800" height="1200" fill="url(#page)"/>

  <!-- Variant 1A -->
  <g transform="translate(210 230)" filter="url(#shadow)">
    <rect x="-160" y="-160" width="320" height="320" rx="72" fill="url(#tileA)"/>
    <g transform="translate(0 -28)" filter="url(#soft)"><use href="#dashcamBody"/></g>
    <path d="M0 35 V94" stroke="url(#greenBlue)" stroke-width="26" stroke-linecap="round"/>
    <path d="M-34 72 L0 112 L34 72 Z" fill="url(#greenBlue)"/>
    <g transform="translate(-38 75) scale(.9)"><use href="#sdSmall"/></g>
  </g>

  <!-- Variant 1B -->
  <g transform="translate(510 230)" filter="url(#shadow)">
    <rect x="-160" y="-160" width="320" height="320" rx="72" fill="url(#tileB)"/>
    <g transform="translate(-15 -38) scale(.9)" filter="url(#soft)"><use href="#dashcamBody"/></g>
    <g transform="translate(34 82) rotate(-8) scale(.88)"><use href="#sdSmall"/></g>
    <path d="M-72 40 C-34 58 -4 62 28 77" fill="none" stroke="url(#greenBlue)" stroke-width="22" stroke-linecap="round"/>
    <path d="M10 45 L54 89 L0 101 Z" fill="url(#greenBlue)" transform="rotate(-8 27 76)"/>
  </g>

  <!-- Variant 1C -->
  <g transform="translate(810 230)" filter="url(#shadow)">
    <rect x="-160" y="-160" width="320" height="320" rx="72" fill="url(#tileC)"/>
    <g transform="translate(0 -48) scale(.83)" filter="url(#soft)"><use href="#dashcamBody"/></g>
    <g transform="translate(-80 70) scale(.78)"><use href="#sdSmall"/></g>
    <g transform="translate(25 70) scale(.78)"><use href="#sdSmall"/></g>
    <path d="M0 18 V75" stroke="url(#greenBlue)" stroke-width="22" stroke-linecap="round"/>
    <path d="M-28 54 L0 90 L28 54 Z" fill="url(#greenBlue)"/>
  </g>

  <!-- Variant 2A -->
  <g transform="translate(210 730)" filter="url(#shadow)">
    <rect x="-160" y="-160" width="320" height="320" rx="72" fill="url(#tileA)"/>
    <g transform="translate(-20 -8)" filter="url(#soft)"><use href="#lensCore"/></g>
    <g transform="translate(55 70)">
      <path d="M-60 -36 H-18 L-4 -20 H64 Q76 -20 76 -8 V58 Q76 70 64 70 H-60 Q-72 70 -72 58 V-24 Q-72 -36 -60 -36 Z" fill="url(#folder)"/>
      <path d="M0 -2 V36" stroke="#eaffff" stroke-width="13" stroke-linecap="round"/>
      <path d="M-20 20 L0 43 L20 20 Z" fill="#eaffff"/>
    </g>
  </g>

  <!-- Variant 2B -->
  <g transform="translate(510 730)" filter="url(#shadow)">
    <rect x="-160" y="-160" width="320" height="320" rx="72" fill="url(#tileB)"/>
    <g transform="translate(0 -20)" filter="url(#soft)"><use href="#lensCore"/></g>
    <g transform="translate(72 80) scale(.82)">
      <path d="M-60 -36 H-18 L-4 -20 H64 Q76 -20 76 -8 V58 Q76 70 64 70 H-60 Q-72 70 -72 58 V-24 Q-72 -36 -60 -36 Z" fill="url(#folder)"/>
      <path d="M0 -2 V36" stroke="#eaffff" stroke-width="13" stroke-linecap="round"/>
      <path d="M-20 20 L0 43 L20 20 Z" fill="#eaffff"/>
    </g>
  </g>

  <!-- Variant 2C -->
  <g transform="translate(810 730)" filter="url(#shadow)">
    <rect x="-160" y="-160" width="320" height="320" rx="72" fill="url(#tileC)"/>
    <g transform="translate(-28 -18) scale(.86)" filter="url(#soft)"><use href="#lensCore"/></g>
    <g transform="translate(55 78) scale(.72)"><use href="#sdSmall"/></g>
    <path d="M60 0 V58" stroke="url(#greenBlue)" stroke-width="19" stroke-linecap="round"/>
    <path d="M36 37 L60 67 L84 37 Z" fill="url(#greenBlue)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Arial, sans-serif" font-size="38" fill="#4a5563" text-anchor="middle">
    <text x="210" y="440">1A</text>
    <text x="510" y="440">1B</text>
    <text x="810" y="440">1C</text>
    <text x="210" y="940">2A</text>
    <text x="510" y="940">2B</text>
    <text x="810" y="940">2C</text>
  </g>
</svg>
