id: blackvue-dr970x-lte-plus
manufacturer: BlackVue
model: DR970X LTE Plus
status: seeded
channel_variants:
  - channels: 1
    roles:
      - front
    validation: real_card_sampled
  - channels: 2
    roles:
      - front
      - rear
    validation: real_card_sampled
sampled_variant:
  channels: 2
  roles:
    - front
    - rear
source_notes:
  - docs/supported-cameras.md
detection:
  high_confidence:
    - path: BlackVue/Config/version.bin
      contains: "model = DR970X LTE Plus"
    - path: BlackVue/Config/micom_version.bin
      contains: "model = DR970X LTE Plus"
  supporting:
    - path: BlackVue/Config/config.ini
      contains:
        - "ap_ssid=BlackVue970XLTEP-"
    - path: BlackVue/Config/bt_ssid.bin
      contains:
        - "BlackVue970XLTEP-"
    - folder: BlackVue/Record
    - volume_label: BLACKVUE
      strength: weak
folders:
  - path: BlackVue/Record
    mode: mixed_recordings
    validation: real_card_sampled
  - path: BlackVue/Config
    mode: model_and_settings
    validation: real_card_sampled
    import: false
filename_patterns:
  - pattern: "^(\\d{8})_(\\d{6})_([NEMP])([FR])\\.mp4$"
    applies_to:
      - BlackVue/Record
    case_sensitive: true
    timestamp:
      date_group: 1
      time_group: 2
      format: YYYYMMDD_HHMMSS
    mode_group: 3
    channel_group: 4
modes:
  N: normal
  E: event
  M: manual
  P: parking
channels:
  F: front
  R: rear
grouping:
  keys:
    - date
    - time
    - mode
  expected_sets:
    two_channel:
      - F
      - R
observed_media:
  front:
    codec: HEVC
    resolution: 3840x2160
    fps: 30
    bitrate: approximately 60 Mbps
  rear:
    codec: HEVC
    resolution: 1920x1080
    fps: 30
    bitrate: approximately 10 Mbps
firmware:
  observed_version: "1.008"
  observed_revision: 1375
  micom_version: "2.00"
  config_path: BlackVue/Config/version.bin
privacy:
  do_not_read:
    - BlackVue/Config/config.ini
    - BlackVue/Config/bt_ssid.bin
  do_not_log:
    - WiFi SSIDs
    - WiFi passwords
    - Cloud credentials
    - Bluetooth identifiers
exclude:
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
  - BlackVue/Config/config.ini
  - BlackVue/Config/bt_ssid.bin
  - BlackVue/System/**
notes:
  - "Real card sampled at /Volumes/BLACKVUE 2 on 2026-06-08."
  - "Model evidence came from version.bin and micom_version.bin. Raw config.ini also includes private WiFi/cloud settings and must not be logged."
  - "AP/BT SSID prefix observed as BlackVue970XLTEP-, useful supporting evidence but not a primary model identifier."
