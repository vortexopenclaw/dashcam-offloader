id: viofo-a129-plus-duo
manufacturer: VIOFO
model: A129 Plus Duo
status: seed
confidence: medium
source_notes:
  - docs/research/nas-dashcam-pattern-sampling-2026-06-06.md
detection:
  supporting:
    - method: filename_pattern
      pattern: "A129 Duo/Plus generation filename styles"
folders:
  - path: DCIM/Movie
    mode: continuous
    validation: inferred
  - path: DCIM/Movie/RO
    mode: protected
    validation: inferred
  - path: DCIM/Movie/Parking
    mode: parking
    validation: inferred
filename_patterns:
  - pattern: "^(\\d{4})(\\d{2})(\\d{2})(\\d{6})_(\\d+)(F|R|PF|PR)\\.MP4$"
    timestamp:
      format: YYYYMMDDHHMMSS
    modes:
      PF: parking
      PR: parking
    channels:
      F: front
      R: rear
      PF: parking_front
      PR: parking_rear
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(PF|PR)\\.MP4$"
    timestamp:
      format: YYYY_MMDD_HHMMSS
    modes:
      PF: parking
      PR: parking
    channels:
      PF: parking_front
      PR: parking_rear
channels:
  F: front
  R: rear
  PF: parking_front
  PR: parking_rear
exclude:
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
