id: viofo-a119m-pro
manufacturer: VIOFO
model: A119M Pro
status: seed
source_notes:
  - docs/card-profiles/viofo-a119m-pro.md
  - docs/research/viofo-a119m-pro.md
detection:
  high_confidence:
    - method: osd_ocr
      source: front_channel_video
      strip: bottom_8pct
      threshold_method: half_max_brightness
      matches: "VIOFO A119M Pro"
      case_sensitive: false
      notes: >
        Camera burns "VIOFO A119M Pro" into the bottom-center of every frame. Extract
        bottom 8% of the front-channel MP4, apply brightness threshold at 50% of max
        pixel value, scale 4x, OCR with tesseract --psm 6. Confirmed on multiple day
        and night clips from real footage. Some high-contrast bright scenes (direct sun,
        reflective surfaces) may produce garbled OCR — retry with additional frames.
  notes: >
    Single-channel camera (front only). No model-identifying file confirmed on card
    (no direct card scan available). Filename pattern is distinct from all other VIOFO
    models — no underscore separators in the date/time component. OSD OCR is the
    recommended detection method.
folders:
  - path: DCIM/Movie
    mode: continuous
    validation: inferred
    notes: Inferred. Card structure not directly scanned; parking subfolder presence unknown.
filename_patterns:
  - pattern: "^(\\d{4})(\\d{2})(\\d{2})(\\d{6})_(\\d+)\\.MP4$"
    applies_to:
      - DCIM/Movie
    case_sensitive: true
    timestamp:
      year_group: 1
      month_group: 2
      day_group: 3
      time_group: 4
      format: YYYYMMDDHHMMSS
    sequence_group: 5
    notes: >
      Format: YYYYMMDDHHMMSS_SEQUENCE.MP4. No underscore separators within the
      date/time component — the entire datetime is a 14-digit concatenated number.
      No channel letter — this is a single-channel (front-only) camera. Sequence
      number is a global monotonic counter; observed up to ~468 in NAS sample across
      multiple recording dates, confirming persistence across sessions.
channels:
  F: front
resolutions:
  F: 3840x2160
  validation: footage_sampled
  notes: Default 4K front. Users can adjust resolution in camera settings.
exclude:
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
  - format.txt
  - DCIM/.diskdb
