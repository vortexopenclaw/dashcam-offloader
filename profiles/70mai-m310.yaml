make: 70mai
model: M310
slug: 70mai-m310
channels: 1

detection:
  high_confidence:
    - method: filename_pattern
      pattern: '^(NO|LA|EV)\d{8}-\d{6}-\d+\.mp4$'
      flags: [case_sensitive]
      notes: >
        70mai M310 uses a two-letter uppercase mode prefix (NO = normal recording,
        LA = time-lapse parking, EV = event/locked) followed by YYYYMMDD-HHMMSS-SEQUENCE
        and a lowercase .mp4 extension. This scheme is distinctive from VIOFO, Thinkware,
        BlackVue, and Vantrue patterns. Global monotonic sequence counter confirmed
        across all recording modes.
    - method: card_marker_file
      path: '.formated'
      location: root
      notes: >
        70mai creates a hidden file named exactly ".formated" (note: not ".formatted")
        in the root of the card when the card is formatted in-camera. Confirmed present
        on real card scan. Provides a strong 70mai-family signal.
    - method: folder_set
      folders: [Normal, Event, Parking, Photo, Lapse]
      notes: >
        All five folders confirmed present on a real M310 microSD card. Each folder
        also contains a hidden ".sstar.format" file. This folder set is distinct from
        VIOFO (uses DCIM/), Thinkware, and BlackVue layouts.

  supporting:
    - method: file_extension
      value: '.mp4'
      case: lowercase
      notes: >
        VIOFO cameras use uppercase .MP4; 70mai M310 uses lowercase .mp4. Useful
        negative signal: presence of uppercase .MP4 rules out 70mai.
    - method: resolution
      value: '2304x1296'
      notes: >
        M310 records at 2304x1296 HEVC 30fps on the single front channel. Not uniquely
        identifying on its own, but combined with filename pattern is strong supporting
        evidence.
    - method: osd_content
      strip: bottom_10pct
      notes: >
        OSD displays date/time in MM-DD-YYYY HH:MM:SS format followed by a pipe
        separator. Does NOT embed model name — different from VIOFO cameras. Cannot
        positively identify M310 model via OCR, but absence of "VIOFO" or similar
        brand text rules out that entire family.

folders:
  - path: 'Normal'
    type: loop_recording
    description: Continuous loop recording during normal driving
    modes: [normal]
    validation: confirmed
    notes: >
      Confirmed on real card scan. Contains NO-prefix files at 60-second segments.
      Hidden .sstar.format file also present in this folder.
  - path: 'Parking'
    type: parking_recording
    description: Normal-sensitivity parking mode recordings
    modes: [parking_normal]
    validation: confirmed
    notes: >
      Confirmed folder exists on card. Stores NO-prefix files recorded during normal
      parking mode (not time-lapse). Distinct from the Lapse/ folder.
      Hidden .sstar.format file present.
  - path: 'Lapse'
    type: parking_timelapse
    description: Time-lapse parking mode recordings
    modes: [parking_timelapse]
    validation: confirmed
    notes: >
      Confirmed folder exists on card. Stores LA-prefix files from time-lapse parking
      mode. LA = Lapse. Hidden .sstar.format file present.
  - path: 'Event'
    type: locked_clips
    description: Emergency/locked clips triggered by impact or "Lock the video" voice command
    modes: [event]
    validation: confirmed
    notes: >
      Confirmed folder exists on card. Manual confirms "Lock the video" voice command
      saves to the emergency/event directory. Exact filename prefix for event clips
      (EV? EM?) not confirmed from footage — no event clips available in sample.
      Hidden .sstar.format file present.
  - path: 'Photo'
    type: photos
    description: Photo snapshots
    modes: [photo]
    validation: confirmed
    notes: >
      Confirmed folder exists on card. Manual confirms "Take photo" voice command
      saves a photo. Hidden .sstar.format file present.

card_markers:
  - path: '.formated'
    location: root
    description: >
      Created by the camera when the card is formatted in-camera. Note unusual
      spelling ("formated" not "formatted"). Confirms this is a 70mai-formatted card.
  - path: '.sstar.format'
    location: per_folder
    description: >
      Present in each of the five recording folders. Purpose unclear — likely a
      folder initialization marker written by the camera firmware.

filename_patterns:
  normal:
    prefix: 'NO'
    folder: 'Normal'
    regex: '^NO(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})-(\d+)\.mp4$'
    example: 'NO20240101-120000-000001.mp4'
    description: Normal/loop recording during driving
    groups:
      year: 1
      month: 2
      day: 3
      hour: 4
      minute: 5
      second: 6
      sequence: 7

  parking_normal:
    prefix: 'NO'
    folder: 'Parking'
    regex: '^NO(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})-(\d+)\.mp4$'
    description: Normal-sensitivity parking mode (same prefix as normal recording, different folder)

  parking_timelapse:
    prefix: 'LA'
    folder: 'Lapse'
    regex: '^LA(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})-(\d+)\.mp4$'
    example: 'LA20240101-120000-000001.mp4'
    description: Time-lapse parking mode recording
    groups:
      year: 1
      month: 2
      day: 3
      hour: 4
      minute: 5
      second: 6
      sequence: 7

  event:
    prefix: 'EV'
    folder: 'Event'
    regex: '^EV(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})-(\d+)\.mp4$'
    description: Event/locked clip (prefix EV inferred; not confirmed from footage)
    validation: inferred

  generic:
    regex: '^([A-Z]{2})(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})-(\d+)\.mp4$'
    description: Matches any two-letter mode prefix variant

channels:
  front:
    id: front
    description: Single front-facing camera (no rear or interior channel)
    resolution: 2304x1296
    codec: hevc
    fps: 30
    segment_duration: 60

resolutions:
  front: '2304x1296'

video:
  segment_duration_seconds: 60
  codec: hevc
  fps: 30
  extension: '.mp4'
  extension_case: lowercase

sequence:
  scope: global
  padding: 6
  notes: >
    Sequence number is a global monotonic counter shared across all recording modes
    and folders (NO normal, NO parking, LA time-lapse all increment the same counter).
    Zero-padded to 6 digits. Counter does not reset on card format.

osd:
  location: bottom
  format: 'MM-DD-YYYY HH:MM:SS | [additional data]'
  contains_model_name: false
  notes: >
    The 70mai M310 burns date/time and additional data (possibly GPS speed) into
    the bottom of every frame. It does NOT embed the model name. The OSD format
    MM-DD-YYYY distinguishes it from cameras using DD-MM-YYYY or YYYY-MM-DD, but
    cannot be used alone to identify this specific model.

validation:
  card_sampled: true
  footage_sampled: true
  osd_model_confirmed: false
  notes: >
    Real card scan performed. Folder structure fully confirmed: Normal/, Parking/,
    Lapse/, Event/, Photo/ all present. .formated root marker and .sstar.format
    per-folder markers confirmed. Filename pattern and resolution confirmed from
    private archive sample (ffprobe). Event clip prefix not confirmed.
