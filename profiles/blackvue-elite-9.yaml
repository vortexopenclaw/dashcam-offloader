id: blackvue-elite-9
manufacturer: BlackVue
model: Elite 9
status: validated
channel_variants:
  - channels: 2
    roles:
      - front
      - rear
    validation: real_card_sampled
sampled_variant:
  channels: 2
  roles:
    - front
    - rear
source_notes:
  - docs/card-profiles/blackvue-elite-9.md
  - docs/research/blackvue-elite-9.md
detection:
  high_confidence:
    - path: BlackVue/Config/version.bin
      contains:
        - "model = ELITE 9"
    - path: BlackVue/Config/micom_version.bin
      contains:
        - "model = ELITE 9"
    - path: BlackVue/Config/smart_gsensor_version.bin
      contains:
        - "model = ELITE 9"
  supporting:
    - folder: BlackVue/Record
    - volume_label: BLACKVUE
      strength: weak
  metadata_rules:
    - source: mp4_cprt
      safe_fields:
        - model
        - ver
        - rev
        - isp_front_ver
        - isp_rear_ver
        - lang
      ignore_fields:
        - psn
        - temp
        - GPS
folders:
  - path: BlackVue/Record
    mode: mixed_recordings
    validation: real_card_sampled
  - path: BlackVue/Config
    mode: model_and_settings
    validation: real_card_sampled
    import: false
filename_patterns:
  - pattern: "^(\\d{8})_(\\d{6})_([NEMPI])([FR])\\.mp4$"
    applies_to:
      - BlackVue/Record
    case_sensitive: true
    timestamp:
      date_group: 1
      time_group: 2
      format: YYYYMMDD_HHMMSS
    mode_group: 3
    channel_group: 4
    modes:
      N: normal
      E: event
      M: manual
      P: parking_motion_or_timelapse
      I: parking_impact_detection
    channels:
      F: front
      R: rear
channels:
  F: front
  R: rear
grouping:
  keys:
    - date
    - time
    - mode
  expected_sets:
    two_channel:
      - F
      - R
observed_counts:
  files:
    NF: 538
    NR: 538
    PF: 531
    PR: 531
    IF: 456
    IR: 456
  groups:
    total: 1525
    complete_normal_pairs: 538
    complete_parking_pairs: 531
    complete_impact_event_pairs: 456
    incomplete_pairs: 0
exclude:
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
  - BlackVue/Config/config.ini
  - BlackVue/Config/bt_ssid.bin
  - BlackVue/System/**
