id: vantrue-n5
manufacturer: Vantrue
model: N5
status: seed
confidence: medium
source_notes:
  - docs/research/nas-dashcam-pattern-sampling-2026-06-06.md
detection:
  supporting:
    - method: filename_pattern
      pattern: "YYYYMMDD_HHMMSS_SEQ_N_(A|B|C|D).MP4"
folders:
  - path: Normal
    mode: normal
  - path: Event
    mode: event
  - path: Parking
    mode: parking
  - path: Photo
    mode: photo
filename_patterns:
  - pattern: "^(\\d{8})_(\\d{6})_(\\d{5})_([NEP])_([ABCD])\\.(MP4|JPG)$"
    timestamp:
      format: YYYYMMDD_HHMMSS
    modes:
      N: normal
      E: event
      P: parking
    channels:
      A: front
      B: interior_front
      C: interior_rear
      D: rear
channels:
  A: front
  B: interior_front
  C: interior_rear
  D: rear
exclude:
  - GPS/**
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
