id: vueroid-h1
manufacturer: Vueroid
model: H1 QHD Infinite
status: seed
channel_variants:
  - channels: 1
    roles:
      - front
    validation: app_submission_and_real_card_sampled
    notes: >
      Historical learning submission and real-card research on firmware V0.5.9
      reported 1CH and filenames without S1 physical camera suffixes. This is
      historical evidence, not a guarantee of current retail firmware behavior.
sampled_variants:
  - channels: 1
    roles:
      - front
source_notes:
  - docs/card-profiles/vueroid-h1.md
  - >
    Restored from the reviewed historical profile before fbb9e3b with private
    source identifiers removed. Exact parking subtype remains unknown.
detection:
  disqualifying:
    - path: CONFIG/config.bin
      must_not_contain: S1-4K-INFINITE
    - path: CONFIG/config.bin
      must_not_contain: S1-QHD-INFINITE
  high_confidence:
    - path: CONFIG/config.bin
      contains: H1-QHD-INFINITE
  supporting:
    - folder: INF
    - folder: EVENT
    - folder: PARK
    - folder: PEVENT
    - folder: USER
folders:
  - path: INF
    mode: continuous
    validation: app_submission_and_real_card_sampled
  - path: EVENT
    mode: driving_event
    validation: app_submission_and_real_card_sampled
  - path: PARK
    mode: parking
    validation: app_submission_and_real_card_sampled
  - path: PEVENT
    mode: parking_event
    validation: app_submission_and_real_card_sampled
  - path: USER
    mode: manual
    validation: app_submission_and_real_card_sampled
  - path: BOOKMARK
    mode: bookmark_image
    validation: real_card_sampled
    import: false
filename_patterns:
  - pattern: "^(\\d{8})_(\\d{6})_([A-Z]+)_([A-Z])\\.mp4$"
    case_sensitive: false
    timestamp:
      date_group: 1
      time_group: 2
      format: YYYYMMDD_HHMMSS
    channels:
      N: front
channels:
  F: front
observed_flags:
  N: unknown_observed_on_visible_samples
grouping:
  keys:
    - date
    - time
    - prefix
  channel_sets:
    1ch:
      channels: [F]
      validation: app_submission_and_real_card_sampled
exclude:
  - CONFIG/**
  - .TFF_REC_RESERVE*
  - "*.SYS"
  - "*.NFF"
  - .Spotlight-V100/**
  - .fseventsd/**
  - "._*"
