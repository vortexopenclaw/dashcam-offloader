id: viofo-a329t
manufacturer: VIOFO
model: A329T
status: experimental
related_profiles:
  - viofo-a329s
channel_variants:
  - channels: 2
    roles:
      - front
      - telephoto
    validation: official_reference
  - channels: 3
    roles:
      - front
      - rear
      - telephoto
    validation: official_reference
sampled_variant:
  channels: 3
  roles:
    - front
    - rear
    - telephoto
  validation: app_submission_sampled
source_notes:
  - docs/card-profiles/viofo-a329t.md
  - docs/research/viofo-a329t.md
detection:
  supporting:
    - folder: DCIM/Movie
      validation: app_submission_sampled
    - folder: DCIM/Movie/Parking
      validation: app_submission_sampled
    - folder: DCIM/Movie/RO
      validation: app_submission_sampled
    - folder: DCIM/Photo
      validation: app_submission_sampled
    - volume_label: A329T
      strength: weak
folders:
  - path: DCIM/Movie
    mode: continuous
    validation: app_submission_sampled
  - path: DCIM/Movie/Parking
    mode: parking
    validation: app_submission_sampled
    notes: Contains parking clips that may include low-bitrate continuous recording and motion-triggered auto-event recording. The app infers subtypes from timing and video specs when folder names do not distinguish them.
  - path: DCIM/Movie/RO
    mode: protected
    validation: app_submission_sampled
    notes: Protected parking-channel suffixes are treated as parking impact-detection recordings.
  - path: DCIM/Photo
    mode: still_image
    validation: app_submission_sampled
filename_patterns:
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|R|T|PF|PR|PT)\\.MP4$"
    applies_to:
      - DCIM/Movie
      - DCIM/Movie/Parking
      - DCIM/Movie/RO
    case_sensitive: true
    validation: app_submission_sampled
    notes: Real app scan confirms T/PT as telephoto and PF/PR/PT as parking-channel variants.
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|R|T|PF|PR|PT)\\.JPG$"
    applies_to:
      - DCIM/Photo
    case_sensitive: true
    validation: app_submission_sampled
    notes: Still photos can use the same channel suffix family as videos.
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
channels:
  F: front
  R: rear
  T: telephoto
  PF: parking_front
  PR: parking_rear
  PT: parking_telephoto
grouping:
  keys:
    - year
    - month_day
    - time
  expected_sets:
    two_channel:
      - F
      - T
    three_channel:
      - F
      - R
      - T
    parking_three_channel:
      - PF
      - PR
      - PT
multiplexed_video:
  support: supported
  validation: official_reference
  default_behavior: separate_files
  filename_validation: pending_real_card_sample
  notes: Official VIOFO A329T sources confirm Multiplex Video with telephoto support. Vortex Radar review evidence describes selectable 2CH and 3CH layouts, but no real multiplexed file from an A329T card has been sampled yet.
  layouts:
    - id: two_channel_front_telephoto_side_by_side
      roles:
        - front
        - telephoto
      applies_to_variants:
        - 2CH
        - 3CH
      output_resolution: 7680x2160
      validation: official_reference
    - id: two_channel_front_rear_side_by_side
      roles:
        - front
        - rear
      applies_to_variants:
        - 3CH
      output_resolution: 7680x2160
      validation: review_walkthrough
    - id: three_channel_front_telephoto_rear_stacked
      roles:
        - front
        - telephoto
        - rear
      applies_to_variants:
        - 3CH
      output_resolution: 3840x3240
      validation: official_reference
  path_candidates:
    - DCIM/Movie
    - DCIM/Movie/Parking
    - DCIM/Movie/RO
  excluded_export_paths:
    - DCIM/Movie/.dashcamexport/**
exclude:
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
  - format.txt
  - DCIM/.diskdb
  - DCIM/*.bin
  - DCIM/Movie/.dashcamexport/**
