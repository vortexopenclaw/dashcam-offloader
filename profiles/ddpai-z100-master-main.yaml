id: ddpai-z100-master-main
manufacturer: DDPAI
model: Z100 Master (Main Unit)
status: manual_only
confidence: low
channel_variants:
  - channels: 2
    roles:
      - front
      - telephoto
    validation: owner_confirmed
  - channels: 3
    roles:
      - front
      - telephoto
      - rear
    validation: owner_confirmed
detection:
  high_confidence:
    - method: osd_ocr
      matches: DDPAI Z100 Master
      strip: bottom_16pct
source_notes:
  - docs/card-profiles/ddpai-z100-master-main.md
  - "Exact DDPAI Z100 Master front OSD or bounded allowlisted UI device-info with exact logging identity and safe main-front video can activate this profile; shared folders and volume labels cannot"
  - "Manual selection must confirm model AND main-unit card; separate cabin/accessory cards are excluded"
  - "Optional rear footage is counted only when actually observed; a separately recording cabin is never inferred"
  - "Owner confirms built-in front/telephoto; inside stores telephoto on the main card"
  - "Owner confirms front S_ and rear Q_ videos in their respective main-card video folders are time-lapse parking; do not apply to inside, wrong folders/prefixes, sibling models or accessory cards"
folders:
  - path: DCIM/200video
    mode: continuous
  - path: DCIM/201photo
    mode: still_image
  - path: DCIM/202thumb
    mode: still_image
    import: false
channels:
  front: front
  inside: telephoto
  rear: rear
