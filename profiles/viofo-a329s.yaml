id: viofo-a329s
manufacturer: VIOFO
model: A329S
status: seed
channel_variants:
  - channels: 1
    roles:
      - front
    validation: official_reference
  - channels: 2
    roles:
      - front
      - rear
    validation: official_reference
  - channels: 2
    variant: IR
    roles:
      - front
      - interior
    validation: official_reference
  - channels: 3
    roles:
      - front
      - interior
      - rear
    validation: real_card_sampled
sampled_variant:
  channels: 3
  roles:
    - front
    - interior
    - rear
source_notes:
  - docs/card-profiles/viofo-a329s.md
  - docs/research/viofo-a329s.md
platform_notes: >
  Shares a similar folder and filename family with VIOFO A229-series cards, but
  Ariel confirmed A329S uses a different processor/internal platform. Do not
  inherit A229 codec, bitrate, or transcode assumptions without direct A329S
  clip validation.
resolutions:
  F: 3840x2160
  I: 2560x1440
  R: 2560x1440
  notes: 3CH layout confirmed by Ariel; codec and bitrate should be remeasured from direct A329S camera files.
detection:
  high_confidence:
    - method: osd_ocr
      source: front_channel_video
      strip: bottom_8pct
      threshold_method: half_max_brightness
      matches: "VIOFO A329S"
      notes: >
        Camera burns "VIOFO A329S" into the bottom-center of every frame. Extract
        bottom 8% of any front-channel (F) MP4, apply brightness threshold at 50% of
        max pixel value, scale 4x, OCR with tesseract --psm 6. Confirmed on real card.
  supporting:
    - folder: DCIM/Movie
    - folder: DCIM/Movie/Parking
    - folder: DCIM/Movie/RO
    - folder: DCIM/Photo
    - volume_label: A329S
      strength: weak
  notes: >
    No reliable model-identifying file on card. DCIM/FWA329S.bin only appears if the
    user manually places a firmware file for an update; it is removed on next format.
    Folder structure and filename pattern are identical to VIOFO A229 models. OSD OCR
    on front-channel video is the recommended detection method.
folders:
  - path: DCIM/Movie
    mode: continuous
    validation: real_card_sampled
  - path: DCIM/Movie/Parking
    mode: parking
    validation: real_card_sampled
  - path: DCIM/Movie/RO
    mode: protected
    validation: real_card_sampled
    notes: Contains both normal and parking channel suffixes on the sampled card.
  - path: DCIM/Photo
    mode: still_image
    validation: real_card_sampled
filename_patterns:
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|I|R)\\.MP4$"
    applies_to:
      - DCIM/Movie
      - DCIM/Movie/RO
    case_sensitive: true
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(PF|PI|PR)\\.MP4$"
    applies_to:
      - DCIM/Movie/Parking
      - DCIM/Movie/RO
    case_sensitive: true
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|I|R|PF|PI|PR)\\.JPG$"
    applies_to:
      - DCIM/Photo
    case_sensitive: true
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
channels:
  F: front
  I: interior
  R: rear
  PF: parking_front
  PI: parking_interior
  PR: parking_rear
grouping:
  keys:
    - year
    - month_day
    - time
  expected_sets:
    normal:
      - F
      - I
      - R
    parking:
      - PF
      - PI
      - PR
multiplexed_video:
  support: supported
  validation: official_reference
  default_behavior: separate_files
  filename_validation: pending_real_card_sample
  notes: Official VIOFO sources describe A329S Multiplex Video as multiple views in one video. Vortex Radar review evidence describes selectable 2CH and 3CH layouts, but no real multiplexed file from an A329S card has been sampled yet.
  layouts:
    - id: two_channel_front_rear_side_by_side
      roles:
        - front
        - rear
      applies_to_variants:
        - 2CH
        - 3CH
      output_resolution: 7680x2160
      validation: review_walkthrough
    - id: two_channel_front_interior_side_by_side
      roles:
        - front
        - interior
      applies_to_variants:
        - 2CH IR
        - 3CH
      output_resolution: 7680x2160
      validation: review_walkthrough
    - id: three_channel_front_interior_rear_stacked
      roles:
        - front
        - interior
        - rear
      applies_to_variants:
        - 3CH
      output_resolution: 3840x3240
      validation: review_walkthrough
  path_candidates:
    - DCIM/Movie
    - DCIM/Movie/Parking
    - DCIM/Movie/RO
  excluded_export_paths:
    - DCIM/Movie/.dashcamexport/**
exclude:
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
  - format.txt
  - DCIM/.diskdb
  - DCIM/FWA329S.bin
  - DCIM/._FWA329S.bin
  - DCIM/Movie/.dashcamexport/**
