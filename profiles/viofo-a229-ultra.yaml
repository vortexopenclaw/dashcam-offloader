id: viofo-a229-ultra
manufacturer: VIOFO
model: A229 Ultra
status: seed
source_notes:
  - docs/card-profiles/viofo-a229-ultra.md
  - docs/research/viofo-a229-ultra.md
detection:
  high_confidence:
    - method: osd_ocr
      source: front_channel_video
      strip: bottom_8pct
      threshold_method: half_max_brightness
      matches: "VIOFO A229 Ultra"
      notes: >
        Camera burns "VIOFO A229 Ultra" into the bottom-center of every frame. Extract
        bottom 8% of any front-channel (F) MP4, apply brightness threshold at 50% of
        max pixel value, scale 4x, OCR with tesseract --psm 6. Confirmed on multiple
        day and night clips from a private archive sample.
  supporting:
    - folder: DCIM/Movie
    - folder: DCIM/Movie/Parking
    - folder: DCIM/Movie/RO
    - folder: DCIM/Photo
  notes: >
    No model-identifying file on card. Folder structure and filename pattern are identical
    to other VIOFO A229 models and similar to A329S. OSD OCR on front-channel video is the recommended
    detection method. Card structure is inferred from VIOFO platform conventions; no real
    card has been directly scanned. Do not inherit A229 codec or bitrate assumptions for
    A329S; that model uses a different processor/internal platform.
folders:
  - path: DCIM/Movie
    mode: continuous
    validation: inferred
    notes: Inferred from VIOFO A229 platform conventions and similar A329S folder evidence.
  - path: DCIM/Movie/RO
    mode: protected
    validation: inferred
  - path: DCIM/Movie/Parking
    mode: parking
    validation: inferred
  - path: DCIM/Photo
    mode: still_image
    validation: inferred
filename_patterns:
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|I|R|PF|PI|PR)\\.MP4$"
    applies_to:
      - DCIM/Movie
      - DCIM/Movie/RO
      - DCIM/Movie/Parking
    case_sensitive: true
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
    notes: >
      Confirmed from a private archive sample. Sequence number is a global monotonic
      counter across all channels. Treat as variable-length. Do not publish observed
      sequence ranges from private archives.
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|I|R|PF|PI|PR)\\.JPG$"
    applies_to:
      - DCIM/Photo
    case_sensitive: true
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
channels:
  F: front
  I: interior
  R: rear
  PF: parking_front
  PI: parking_interior
  PR: parking_rear
grouping:
  keys:
    - year
    - month_day
    - time
  expected_sets:
    normal:
      - F
      - I
      - R
    parking:
      - PF
      - PI
      - PR
resolutions:
  F: 3840x2160
  I: 1920x1080
  R: 3840x2160
  validation: footage_sampled
  notes: >
    Confirmed from a private archive sample (not a direct card sample). Both front and rear are 4K UHD,
    distinguishing the Ultra from A229 Pro (4K front, 1080P interior, 2K rear) and A229 Plus
    (2K front, 1080P interior, 2K rear).
    Users can adjust resolution in camera settings.
exclude:
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
  - format.txt
  - DCIM/.diskdb
