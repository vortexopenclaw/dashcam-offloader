id: vueroid-s1-4k-infinite
manufacturer: Vueroid
model: S1 4K Infinite
status: seed
channel_variants:
  - channels: 1
    roles:
      - front
    validation: manual_confirmed
  - channels: 2
    roles:
      - front
      - rear
    validation: real_card_sampled
    notes: >
      Confirmed from real 2CH card scan. All recording modes produce F+R pairs at
      identical timestamps. Some clips may be F-only (rear camera disconnected or
      not active for that interval) — this is normal and not a detection failure.
  - channels: 3
    roles:
      - front
      - interior
      - rear
    validation: real_card_sampled
    notes: >
      Confirmed from real 3CH card scan. All recording modes produce F+I+R triplets.
      A small number of F-only clips were observed in INF near the end of the sample.
sampled_variants:
  - channels: 2
    roles:
      - front
      - rear
  - channels: 3
    roles:
      - front
      - interior
      - rear
source_notes:
  - docs/card-profiles/vueroid-s1-4k-infinite.md
detection:
  supporting:
    - folder: INF
    - folder: EVENT
    - folder: PARK
    - folder: PEVENT
    - folder: USER
folders:
  - path: INF
    mode: continuous
    prefix: INF
    validation: real_card_sampled
  - path: EVENT
    mode: driving_event
    validation: manual_confirmed
    notes: No visible MP4 files on either sampled card.
  - path: PARK
    mode: parking_motion_or_timelapse
    prefix: PRK
    validation: real_card_sampled
  - path: PEVENT
    mode: parking_event
    prefix: PVT
    validation: real_card_sampled
  - path: USER
    mode: manual
    prefix: USR
    validation: real_card_sampled
  - path: BOOKMARK
    mode: bookmark_image
    validation: manual_confirmed
    notes: No visible files on either sampled card.
filename_patterns:
  - pattern: "^(\\d{8})_(\\d{6})_([A-Z]+)_([FIR])_([A-Z])\\.mp4$"
    case_sensitive: false
    timestamp:
      date_group: 1
      time_group: 2
      format: YYYYMMDD_HHMMSS
    prefix_group: 3
    channel_group: 4
    flag_group: 5
channels:
  F: front
  I: interior
  R: rear
observed_flags:
  N: unknown_observed_on_visible_samples
grouping:
  keys:
    - date
    - time
    - prefix
  channel_sets:
    3ch:
      channels: [F, I, R]
      validation: real_card_sampled
      notes: >
        Standard 3CH grouping. Small number of F-only clips observed in INF
        near the end of the sampled card.
    2ch:
      channels: [F, R]
      validation: real_card_sampled
      notes: >
        Standard 2CH grouping. Some clips may be F-only when the rear camera
        was not active for that interval.
    1ch:
      channels: [F]
      validation: manual_confirmed
exclude:
  - CONFIG/**
  - .TFF_REC_RESERVE*
  - "*.SYS"
  - "*.NFF"
  - .Spotlight-V100/**
  - .fseventsd/**
  - "._*"
