id: vueroid-s1-4k-infinite
manufacturer: Vueroid
model: S1 4K Infinite
status: seed
channel_variants:
  - channels: 1
    roles:
      - front
    validation: real_card_sampled
    notes: >
      Confirmed from a 2CH card that also contains 1CH driving clips (rear camera
      unplugged for part of the session). F-only clips follow the same filename
      pattern with no R counterpart — no separate 1CH profile needed.
  - channels: 2
    roles:
      - front
      - rear
    validation: real_card_sampled
    notes: >
      Confirmed from real 2CH card scan. All recording modes produce F+R pairs at
      identical timestamps when both cameras are active. The same card also contains
      1CH clips (F-only) from periods when the rear camera was unplugged.
  - channels: 3
    roles:
      - front
      - interior
      - rear
    validation: real_card_sampled
    notes: >
      Confirmed from real 3CH card scan. All recording modes produce F+I+R triplets.
      A small number of F-only clips were observed in INF near the end of the sample.
sampled_variants:
  - channels: 1
    roles:
      - front
  - channels: 2
    roles:
      - front
      - rear
  - channels: 3
    roles:
      - front
      - interior
      - rear
source_notes:
  - docs/card-profiles/vueroid-s1-4k-infinite.md
detection:
  disqualifying:
    - path: CONFIG/config.bin
      must_not_contain: H1-QHD-INFINITE
  supporting:
    - folder: INF
    - folder: EVENT
    - folder: PARK
    - folder: PEVENT
    - folder: USER
folders:
  - path: INF
    mode: continuous
    prefix: INF
    validation: real_card_sampled
  - path: EVENT
    mode: driving_event
    validation: manual_confirmed
    notes: No visible MP4 files on either sampled card.
  - path: PARK
    mode: parking
    prefix: PRK
    validation: real_card_sampled
    parking_mode_detection:
      method: video_frame_rate
      signal: nominalFrameRate
      modes:
        parking_motion:
          frame_rate: 30
          audio: true
          clip_duration_seconds: 30
          notes: >
            Motion/impact detection mode. Standard-speed recording triggered by movement.
            30 fps H.264 video with AAC audio. Clips are exactly 30 seconds.
        parking_timelapse:
          frame_rate: 5
          audio: false
          clip_duration_seconds: 20
          notes: >
            Time-lapse mode. 5 fps H.264 video, no audio track. Each clip covers
            a compressed interval. File sizes are pre-allocated identically to motion
            clips — size cannot be used to distinguish modes.
      notes: >
        Motion detection and time-lapse parking clips use the same PARK/ folder and
        PRK_ filename prefix and are indistinguishable by filename alone. Frame rate
        from the video track is the reliable signal: 30 fps = motion detection,
        5 fps = time-lapse. The app should probe one PARK clip per card using
        AVURLAsset.tracks(withMediaType: .video).first?.nominalFrameRate.
  - path: PEVENT
    mode: parking_event
    prefix: PVT
    validation: real_card_sampled
    notes: >
      Impact/G-sensor events during parking. Saved separately regardless of whether
      the main parking mode is motion detection or time-lapse.
  - path: USER
    mode: manual
    prefix: USR
    validation: real_card_sampled
  - path: BOOKMARK
    mode: bookmark_image
    validation: manual_confirmed
    notes: No visible files on either sampled card.
filename_patterns:
  - pattern: "^(\\d{8})_(\\d{6})_([A-Z]+)_([FIR])_([A-Z])\\.mp4$"
    case_sensitive: false
    timestamp:
      date_group: 1
      time_group: 2
      format: YYYYMMDD_HHMMSS
    prefix_group: 3
    channel_group: 4
    flag_group: 5
channels:
  F: front
  I: interior
  R: rear
observed_flags:
  N: unknown_observed_on_visible_samples
grouping:
  keys:
    - date
    - time
    - prefix
  channel_sets:
    3ch:
      channels: [F, I, R]
      validation: real_card_sampled
    2ch:
      channels: [F, R]
      validation: real_card_sampled
    1ch:
      channels: [F]
      validation: real_card_sampled
      notes: >
        F-only groups are normal for 1CH operation. The same card may contain
        a mix of 1CH and 2CH groups across different recording sessions.
exclude:
  - CONFIG/**
  - .TFF_REC_RESERVE*
  - "*.SYS"
  - "*.NFF"
  - .Spotlight-V100/**
  - .fseventsd/**
  - "._*"
