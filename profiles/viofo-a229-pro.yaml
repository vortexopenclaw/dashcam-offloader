id: viofo-a229-pro
manufacturer: VIOFO
model: A229 Pro
status: seed
source_notes:
  - docs/card-profiles/viofo-a229-pro.md
  - docs/research/viofo-a229-pro.md
detection:
  high_confidence:
    - method: osd_ocr
      source: front_channel_video
      strip: bottom_8pct
      threshold_method: half_max_brightness
      matches: "VIOFO A229 Pro"
      notes: >
        Camera burns "VIOFO A229 Pro" into the bottom-center of every frame. Extract
        bottom 8% of any front-channel (F) MP4, apply brightness threshold at 50% of
        max pixel value, scale 4x, OCR with tesseract --psm 6. Confirmed on real card.
  supporting:
    - folder: DCIM/Movie
    - folder: DCIM/Movie/Parking
    - folder: DCIM/Movie/RO
    - folder: DCIM/Photo
    - volume_label: A229PRO
      strength: weak
  negative:
    - path: DCIM/FWA329S.bin
      exists: true
      notes: Presence indicates A329S, not A229 Pro.
  notes: >
    No model-identifying file found on real-card sample. Firmware file (FWA229P.bin) is
    placed at card root only during firmware updates and should be removed by reformatting.
    Folder structure and filename pattern are identical to VIOFO A329S 3CH. OSD OCR on
    front-channel video is the recommended detection method.
folders:
  - path: DCIM/Movie
    mode: continuous
    validation: real_card_sampled
  - path: DCIM/Movie/RO
    mode: protected
    validation: real_card_sampled
    notes: >
      Contains locked emergency recordings. Only normal-channel locked clips (F/I/R)
      were observed on the sample card. Whether parking-channel locked clips (PF/PI/PR)
      also appear here is unconfirmed.
  - path: DCIM/Movie/Parking
    mode: parking
    validation: real_card_sampled
    notes: >
      Contains all parking recording subtypes: auto event detection, time-lapse, and
      low bitrate. Subtypes are not distinguishable by folder or filename on this sample.
  - path: DCIM/Photo
    mode: still_image
    validation: real_card_sampled
filename_patterns:
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|I|R|T|PF|PI|PR|PT)\\.MP4$"
    applies_to:
      - DCIM/Movie
      - DCIM/Movie/RO
      - DCIM/Movie/Parking
    case_sensitive: true
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
    notes: >
      Sequence number is a global monotonic counter across all channels and modes.
      Observed as 6 digits (000511-006759) on the real-card sample; manual example shows
      5 digits. Treat as variable-length.
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|I|R|T|PF|PI|PR|PT)\\.JPG$"
    applies_to:
      - DCIM/Photo
    case_sensitive: true
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
channels:
  F: front
  I: interior
  R: rear
  T: telephoto
  PF: parking_front
  PI: parking_interior
  PR: parking_rear
  PT: parking_telephoto
grouping:
  keys:
    - year
    - month_day
    - time
  expected_sets:
    normal:
      - F
      - I
      - R
    parking:
      - PF
      - PI
      - PR
  notes: >
    T and PT channels appear when a telephoto camera is attached. Grouping key is
    timestamp (year + month_day + time), not sequence number.
exclude:
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
  - format.txt
  - DCIM/.diskdb
