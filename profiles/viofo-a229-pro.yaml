id: viofo-a229-pro
manufacturer: VIOFO
model: A229 Pro
status: seed
source_notes:
  - docs/card-profiles/viofo-a229-pro.md
  - docs/research/viofo-a229-pro.md
sampled_variant:
  channels: 3
  roles:
    - front
    - interior
    - rear
  latest_sample:
    path: /Volumes/Untitled
    scanned_at: 2026-06-08
    normal_triplets: 210
    parking_triplets: 1866
    protected_triplets: 1
    photo_triplets: 1
detection:
  high_confidence:
    - method: osd_ocr
      source: front_channel_video
      strip: bottom_8pct
      threshold_method: half_max_brightness
      matches: "VIOFO A229 Pro"
      notes: >
        Camera burns "VIOFO A229 Pro" into the bottom-center of every frame. Extract
        bottom 8% of any front-channel (F) MP4, apply brightness threshold at 50% of
        max pixel value, scale 4x, OCR with tesseract --psm 6. Confirmed on real card.
  supporting:
    - folder: DCIM/Movie
    - folder: DCIM/Movie/Parking
    - folder: DCIM/Movie/RO
    - folder: DCIM/Photo
    - volume_label: A229PRO
      strength: weak
  negative:
    - path: DCIM/FWA329S.bin
      exists: true
      notes: Presence indicates A329S, not A229 Pro.
  notes: >
    No model-identifying file found on real-card sample. Firmware file (FWA229P.bin) is
    placed at card root only during firmware updates and should be removed by reformatting.
    Folder structure and filename pattern are identical to VIOFO A329S 3CH. OSD OCR on
    front-channel video is the recommended detection method.
folders:
  - path: DCIM/Movie
    mode: continuous
    validation: real_card_sampled
  - path: DCIM/Movie/RO
    mode: protected
    validation: real_card_sampled
    notes: >
      Contains locked emergency recordings. Only normal-channel locked clips (F/I/R)
      were observed on the sample card. Whether parking-channel locked clips (PF/PI/PR)
      also appear here is unconfirmed.
  - path: DCIM/Movie/Parking
    mode: parking
    validation: real_card_sampled
    notes: >
      Manual-defined parking folder for auto event detection, time-lapse, and low bitrate.
      The latest sampled card's PF/PI/PR clips were user-confirmed auto event detection
      triggered by motion/impact, not time-lapse or low-bitrate samples.
  - path: DCIM/Photo
    mode: still_image
    validation: real_card_sampled
filename_patterns:
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|I|R|PF|PI|PR)\\.MP4$"
    applies_to:
      - DCIM/Movie
      - DCIM/Movie/RO
      - DCIM/Movie/Parking
    case_sensitive: true
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
    notes: >
      Sequence number is a global monotonic counter across all channels and modes.
      Observed as 6 digits (000511-006759) on real-card samples; manual example shows
      5 digits. Treat as variable-length.
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|I|R|PF|PI|PR)\\.JPG$"
    applies_to:
      - DCIM/Photo
    case_sensitive: true
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
channels:
  F: front
  I: interior
  R: rear
  PF: parking_front
  PI: parking_interior
  PR: parking_rear
grouping:
  keys:
    - year
    - month_day
    - time
  expected_sets:
    normal:
      - F
      - I
      - R
    parking:
      - PF
      - PI
      - PR
  notes: >
    Telephoto T/PT tokens are reserved for telephoto-equipped A329T-style cards,
    not A229 Pro exact-model matching. Grouping key is timestamp (year +
    month_day + time), not sequence number.
resolutions:
  F: 3840x2160
  I: 1920x1080
  R: 2560x1440
  PF: 3840x2160
  PI: 1920x1080
  PR: 2560x1440
  validation: real_card_sampled
  notes: >
    Latest temporary 3CH card measured H.264 at 30 fps. Driving stream bitrates were
    about 36.0 Mbps front, 15.6 Mbps interior, and 24.0 Mbps rear. Parking stream
    bitrates were about 4.1 Mbps front, 3.9 Mbps interior, and 4.1 Mbps rear for
    auto event detection clips. Treat the ~4 Mbps PF/PI/PR measurements as low-bitrate
    parking-mode evidence, not normal driving bitrate.
exclude:
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
  - format.txt
  - DCIM/.diskdb
