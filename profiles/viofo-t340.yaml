id: viofo-t340
manufacturer: VIOFO
model: T340
status: experimental
channel_variants:
  - channels: 4
    roles:
      - front
      - rear
      - interior
      - telephoto
    validation: app_submission_sampled
sampled_variant:
  channels: 4
  roles:
    - front
    - rear
    - interior
    - telephoto
  validation: app_submission_sampled
source_notes:
  - docs/card-profiles/viofo-t340.md
  - "Normal / Low Power 4CH sample: H.264 at 30 fps; front 3840x2160 at ~31.95 Mbps driving, other cameras 2560x1440 at ~14.33 Mbps; parking ~4.095 Mbps each"
  - "Owner confirms HDR on front/interior, off rear/telephoto; not a controlled HDR comparison and not complete-file storage-rate evidence"
  - "High / Low Bitrate 4CH sample: front ~36.86 Mbps driving, 2K cameras ~21.30 Mbps; parking ~4.095 Mbps each; 20 Protected MP4 retain High driving rates"
  - "Sampled F/R/I/T and PF/PR/PI/PT MP4 suffixes and F/R/I/T JPG suffixes are submission-verified; folders and emergency-specific naming remain inferred"
detection:
  supporting:
    - folder: DCIM/Movie
      validation: app_submission_sampled
    - folder: DCIM/Movie/Parking
      validation: inferred
    - folder: DCIM/Movie/RO
      validation: inferred
    - folder: DCIM/Photo
      validation: inferred
    - volume_label: T340
      strength: weak
folders:
  - path: DCIM/Movie
    mode: continuous
    validation: inferred
  - path: DCIM/Movie/Parking
    mode: parking
    validation: inferred
  - path: DCIM/Movie/RO
    mode: protected
    validation: inferred
  - path: DCIM/Photo
    mode: still_image
    validation: inferred
filename_patterns:
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|R|I|T|PF|PR|PI|PT)\\.MP4$"
    applies_to:
      - DCIM/Movie
      - DCIM/Movie/Parking
      - DCIM/Movie/RO
    case_sensitive: true
    validation: app_submission_sampled
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
  - pattern: "^(\\d{4})_(\\d{4})_(\\d{6})_(\\d+)(F|R|I|T|PF|PR|PI|PT)\\.JPG$"
    applies_to:
      - DCIM/Photo
    case_sensitive: true
    validation: inferred
    timestamp:
      year_group: 1
      month_day_group: 2
      time_group: 3
      format: YYYY_MMDD_HHMMSS
    sequence_group: 4
    channel_group: 5
channels:
  F: front
  R: rear
  I: interior
  T: telephoto
  PF: parking_front
  PR: parking_rear
  PI: parking_interior
  PT: parking_telephoto
grouping:
  keys:
    - year
    - month_day
    - time
  expected_sets:
    four_channel:
      - F
      - R
      - I
      - T
    parking_four_channel:
      - PF
      - PR
      - PI
      - PT
exclude:
  - .Trashes/**
  - .fseventsd/**
  - .Spotlight-V100/**
  - "._*"
  - format.txt
  - DCIM/.diskdb
  - DCIM/*.bin
  - DCIM/Movie/.dashcamexport/**
